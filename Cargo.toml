[workspace]
members = [
    "crates/app-core",
    "crates/domain-core",
    "crates/domain-models",
    "crates/study-core",
    "crates/content-core",
    "crates/storage-core",
    "crates/platform-mobile",
    "crates/study-domain-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Word Mobile Team"]
license = "MIT"
repository = "https://github.com/word-mobile/word-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
once_cell = "1.19"

# Storage-specific dependencies
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Testing
tokio-test = "0.4"
